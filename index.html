<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arduino Network Dashboard</title>
    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/for/index.css">
    <script type="module" src="./js/base.js"></script>
    <script type="module" src="./js/for/index.js"></script>
</head>
<body>
    <div id="device-section">
        <header>
            <span>Devices</span>
        </header>
        <div id="device-list">
            <button id="new-device">New Device</button>
        </div>
    </div>
    <div id="automation-section">
        <header>
            <span>Automation</span>
        </header>
        <div id="automation-list">
            <button id="new-automation">New Automation</button>
        </div>
    </div>
    <div id="replay-section">
        <header>
            <span>Replay</span>
        </header>
        <div id="replay-log" contenteditable="plaintext-only"></div>
        <div id="replay-controls">
            <button id="replay-clear">Clear</button>
            <label>
                <span>Record</span>
                <input id="replay-recording" type="checkbox">
            </label>
            <button id="replay-save">Save</button>
        </div>
    </div>
</body>
</html>
