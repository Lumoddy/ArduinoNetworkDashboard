<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arduino Network Dashboard</title>
    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/for/index.css">
    <script type="module" src="./js/base.js"></script>
    <script type="module" src="./js/for/index.js"></script>
    <script type="module" src="./js/elements/edge-resizer.js"></script>
</head>
<body
    style="
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        right: 0;
        display: flex;
        flex-flow: row nowrap;
        justify-content: start;
        align-items: stretch;">
    <div
        id="device-section"
        style="
            overflow-y: scroll;
            flex: 1;
            flex-basis: 100%;">
        <header>
            <span>Devices</span>
        </header>
        <div id="device-list">
            <button id="new-device">New Device</button>
        </div>
    </div>
    <div
        id="automation-section"
        style="
            overflow-y: scroll;
            flex: 1;
            flex-basis: 100%;">
        <header>
            <span>Automations</span>
        </header>
        <div id="automation-list">
            <button id="new-automation">New Automation</button>
        </div>
    </div>
    <div
        id="record-section"
        style="
            overflow-y: scroll;
            flex: 1;
            flex-basis: 100%;">
        <header>
            <span>Log</span>
        </header>
        <div id="record-log" contenteditable="plaintext-only"></div>
    </div>
</body>
</html>
